services:
  mongodb:
    image: mongo:7.0
    ports:
      - "${EXPOSE_DB_PORT:-27018}:27017"
    volumes:
      - mongodb_data:/data/db

  backend:
    image: lens-backend-dev
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "${PORT:-3030}:${PORT:-3030}"
    environment:
      - NODE_ENV=development
      - HOSTNAME=${HOSTNAME:-localhost}
      - PORT=${PORT:-3030}
      - DB_URL=mongodb://mongodb:27017/backend-db
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - VITE_APP_API_URL=${VITE_APP_API_URL:-http://localhost:3030/}
      - FC_WORKER_URL=http://localhost:8080/2015-03-31/functions/function/invocations
      - SMTP_HOST
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_USER
      - SMTP_PASS
      - SMTP_FROM
      - USE_S3
      - AWS_ACCESS_KEY_ID
      - AWS_SECRET_ACCESS_KEY
      - AWS_CLIENT_MODELS_BUCKET
      - AWS_REGION
      - DEFAULT_ADMIN_EMAIL
      - DEFAULT_ADMIN_USERNAME
      - DEFAULT_ADMIN_PASSWORD
      - DEFAULT_ADMIN_NAME
      - LOCAL_SIGNED_URL_SECRET
    volumes:
      - ./backend:/app
      - /app/node_modules
      - uploads_data:/app/uploads
    depends_on:
      - mongodb

  frontend:
    image: lens-frontend-dev
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_APP_API_URL=${VITE_APP_API_URL:-http://localhost:3030/}
      - VITE_MATOMO_URL=${VITE_MATOMO_URL:-http://localhost:7000}
      - VITE_MATOMO_SITE=${VITE_MATOMO_SITE:-1}
      - VITE_STRIPE_PURCHASE_PEER_URL
      - PROXY_SCHEME_PREFIX=${PROXY_SCHEME_PREFIX:-http://}
    depends_on:
      - backend

  fc-worker-redis:
    image: redis:alpine

  fc-worker-api:
    image: lens-fc-worker-api-dev
    build:
      context: ./FC-Worker
      dockerfile: Dockerfile.api.dev
    environment:
      - REDIS_HOST=fc-worker-redis
      - REDIS_PORT=6379
    volumes:
      - ./FC-Worker/fc_worker:/app/fc_worker
      - ./FC-Worker/main.py:/app/main.py
    network_mode: "service:backend"
    depends_on:
      - backend
      - fc-worker-redis

  fc-worker-celery:
    image: lens-fc-worker-celery-dev
    build:
      context: ./FC-Worker
      dockerfile: Dockerfile.celery.dev
    environment:
      - REDIS_HOST=fc-worker-redis
      - REDIS_PORT=6379
      - BACKEND_URL=${BACKEND_URL:-http://localhost:3030}
    volumes:
      - ./FC-Worker/fc_worker:/app/fc_worker
      - ./FC-Worker/main.py:/app/main.py
    # bubblewrap (RUN_CODE_SNIPPET sandbox) needs CAP_SYS_ADMIN + writable cgroup.
    privileged: true
    network_mode: "service:backend"
    depends_on:
      - backend
      - fc-worker-redis

  matomo-db:
    profiles:
      - matomo-enabled
    image: mariadb:11.4.4
    command: --max-allowed-packet=128M
    environment:
      - MYSQL_ROOT_PASSWORD=matomo
      - MYSQL_DATABASE=matomo
      - MYSQL_USER=matomo 
      - MYSQL_PASSWORD=matomo
    volumes:
      - matomo_db:/var/lib/mysql

  matomo:
    profiles:
      - matomo-enabled
    image: amrit3701/bitnami-matomo:5.8.0-debian-12-r4
    ports:
      - "7000:8080"
    environment:
      - MATOMO_DATABASE_HOST=matomo-db
      - MATOMO_DATABASE_TABLE_PREFIX=matomo_
      - MATOMO_DATABASE_USER=matomo
      - MATOMO_DATABASE_PASSWORD=matomo
      - MATOMO_DATABASE_NAME=matomo
      - MATOMO_WEBSITE_NAME=Lens (dev)
      - MATOMO_WEBSITE_HOST=${FRONTEND_URL:-http://localhost:3000}
      - MATOMO_USERNAME=${MATOMO_USERNAME:-admin}
      - MATOMO_PASSWORD=${MATOMO_PASSWORD:-admin@local.test}
      - MATOMO_EMAIL=${MATOMO_EMAIL:-admin@local.test}
    volumes:
      - matomo_data:/bitnami/matomo
    depends_on:
      - matomo-db

  # Keycloak for local OIDC (profile keycloak; realm under docker/keycloak/import)
  keycloak:
    profiles:
      - keycloak
    image: quay.io/keycloak/keycloak:26.6.1
    command:
      - start-dev
      - --import-realm
    ports:
      - "${KEYCLOAK_PORT:-8090}:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin@local.test}
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8090}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    volumes:
      - keycloak_dev_data:/opt/keycloak/data
      - ./docker/keycloak/import:/opt/keycloak/data/import

volumes:
  mongodb_data:
    name: mongodb_data_dev
  uploads_data:
    name: uploads_data_dev
  matomo_db:
    name: matomo_db_dev
  matomo_data:
    name: matomo_data_dev
  keycloak_dev_data:
    name: keycloak_dev_data_dev
